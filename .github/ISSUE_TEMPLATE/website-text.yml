# Generated by scripts/build-content-form.mjs. Edit scripts/lib/content-fields.mjs instead.
name: Website text (change a text)
description: Pick a text on the site and write what it should say, in Finnish, English or both.
title: "Text: "
labels: ["website-text"]
body:
  - type: markdown
    attributes:
      value: |
        Choose the text, then write the new version. Leave a language empty to keep it as it is.
        For lists, separate words with commas. For longer texts, leave an empty line between paragraphs.
  - type: dropdown
    id: which
    attributes:
      label: Which text
      options:
        - "Front page: headline"
        - "Front page: line under the headline"
        - "Front page: Häppeninki short description"
        - "Front page: RYYM short description"
        - "Front page: equipment rental question"
        - "Genre strip words (comma separated)"
        - "Häppeninki page: intro"
        - "RYYM page: intro"
        - "Previously showcased: heading"
        - "Message when no events are announced"
        - "Events page: title"
        - "Gallery page: intro"
        - "Team page: title"
        - "Team page: intro"
        - "Services page: intro"
        - "Services: 1st service title"
        - "Services: 1st service text"
        - "Services: 2nd service title"
        - "Services: 2nd service text"
        - "Services: 3rd service title"
        - "Services: 3rd service text"
        - "Services: 4th service title"
        - "Services: 4th service text"
        - "Equipment rental page: intro"
        - "Contact page: intro"
        - "Contact page: label for bookings email"
        - "Contact page: label for artists email"
        - "Contact page: label for general email"
        - "Footer: copyright line"
    validations:
      required: true
  - type: textarea
    id: fi
    attributes:
      label: New Finnish text
  - type: textarea
    id: en
    attributes:
      label: New English text
  - type: checkboxes
    id: reset
    attributes:
      label: Undo
      options:
        - label: Put back the original text (for the languages left empty, or both if both are empty)
