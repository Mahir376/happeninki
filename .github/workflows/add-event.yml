name: Add event from issue

# Fill in Issues > New issue > "New event". This adds the event to
# src/data/events.json, converts the poster, checks the site still builds,
# commits to main (Vercel then deploys) and replies on the issue.
# Editing the issue updates the same event.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-event
  cancel-in-progress: false

jobs:
  add-event:
    # Only people with write access to the repo can publish events
    if: >-
      contains(github.event.issue.labels.*.name, 'new-event') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Add event
        id: add
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/event-from-issue.mjs

      - name: Check the site still builds
        id: build
        if: steps.add.outcome == 'success'
        continue-on-error: true
        run: npm run lint && npm run build

      - name: Commit and push
        id: push
        if: steps.add.outcome == 'success' && steps.build.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json public/img/posters 2>/dev/null || git add src/data/events.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          TITLE=$(node -p "require('./.event-result.json').title")
          git commit -m "Add event: ${TITLE} (#${ISSUE_NUMBER})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reply on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: |
            const fs = require('fs')
            let result = { ok: false, message: 'Something went wrong before the event could be read. See the workflow log.' }
            try { result = JSON.parse(fs.readFileSync('.event-result.json', 'utf8')) } catch {}
            let body = result.message
            if (result.ok && process.env.BUILD_OUTCOME !== 'success') {
              body = 'The event was read, but the site did not build with it, so nothing was published. See the workflow log, or ask for help.'
              result.ok = false
            } else if (result.ok && process.env.PUSH_OUTCOME !== 'success') {
              body = 'The event was read, but publishing failed. See the workflow log.'
              result.ok = false
            }
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            await github.rest.issues.createComment({ owner, repo, issue_number, body })
            if (result.ok && context.payload.action === 'opened') {
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' })
            }
