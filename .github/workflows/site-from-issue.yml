name: Update site from issue

# Issues > New issue gives two forms:
#   "Event (upcoming or past)"  -> src/data/events.json (+ poster and photos)
#   "Artist (previously showcased)" -> src/data/artists.json (+ photo)
#   "Team member (add or change)" -> src/data/team.json (+ photo)
#   "Website text (change a text)" -> src/data/content.json
# This checks the site still builds, commits to main (Vercel then deploys)
# and replies on the issue. Editing the issue updates the same entry.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: site-from-issue
  cancel-in-progress: false

jobs:
  update:
    # Only people with write access to the repo can publish
    if: >-
      (contains(github.event.issue.labels.*.name, 'new-event') || contains(github.event.issue.labels.*.name, 'new-artist') || contains(github.event.issue.labels.*.name, 'team') || contains(github.event.issue.labels.*.name, 'website-text')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read the form
        id: read
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_ARTIST: ${{ contains(github.event.issue.labels.*.name, 'new-artist') }}
          IS_TEAM: ${{ contains(github.event.issue.labels.*.name, 'team') }}
          IS_TEXT: ${{ contains(github.event.issue.labels.*.name, 'website-text') }}
        run: |
          if [ "$IS_TEXT" = "true" ]; then node scripts/content-from-issue.mjs
          elif [ "$IS_TEAM" = "true" ]; then node scripts/team-from-issue.mjs
          elif [ "$IS_ARTIST" = "true" ]; then node scripts/artist-from-issue.mjs
          else node scripts/event-from-issue.mjs; fi

      - name: Check the site still builds
        id: build
        if: steps.read.outcome == 'success'
        continue-on-error: true
        run: npm run lint && npm run build

      - name: Commit and push
        id: push
        if: steps.read.outcome == 'success' && steps.build.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_ARTIST: ${{ contains(github.event.issue.labels.*.name, 'new-artist') }}
          IS_TEAM: ${{ contains(github.event.issue.labels.*.name, 'team') }}
          IS_TEXT: ${{ contains(github.event.issue.labels.*.name, 'website-text') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/artists.json src/data/team.json src/data/content.json
          for d in public/img/posters public/img/events public/img/artists public/img/team; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          TITLE=$(node -p "require('./.issue-result.json').title")
          KIND=$([ "$IS_TEXT" = "true" ] && echo "text" || ([ "$IS_TEAM" = "true" ] && echo "team member" || ([ "$IS_ARTIST" = "true" ] && echo "artist" || echo "event")))
          git commit -m "Update ${KIND}: ${TITLE} (#${ISSUE_NUMBER})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reply on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: |
            const fs = require('fs')
            let result = { ok: false, message: 'Something went wrong before the form could be read. See the workflow log.' }
            try { result = JSON.parse(fs.readFileSync('.issue-result.json', 'utf8')) } catch {}
            let body = result.message
            if (result.ok && process.env.BUILD_OUTCOME !== 'success') {
              body = 'The form was read, but the site did not build with it, so nothing was published. See the workflow log.'
              result.ok = false
            } else if (result.ok && process.env.PUSH_OUTCOME !== 'success') {
              body = 'The form was read, but publishing failed. See the workflow log.'
              result.ok = false
            }
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            await github.rest.issues.createComment({ owner, repo, issue_number, body })
            if (result.ok && context.payload.action === 'opened') {
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' })
            }
